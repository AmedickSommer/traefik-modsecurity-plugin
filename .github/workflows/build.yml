name: Build

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  integration:
    name: Traefik + OWASP CRS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: End-to-end checks
        run: integration/run.sh
